<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Roulette OBS Achievement Bar</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main id="achievementBar" class="achievement-bar" aria-live="polite" aria-atomic="true">
    <div id="achievementIcon" class="achievement-icon" aria-hidden="true">✦</div>
    <div class="achievement-copy">
      <span class="eyebrow">RETROACHIEVEMENTS · UNLOCKED</span>
      <strong id="achievementTitle">Achievement unlocked</strong>
      <span id="gameTitle" class="game-title"></span>
    </div>
    <div id="achievementPoints" class="points"></div>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
